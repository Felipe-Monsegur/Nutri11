<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nutri11 — opciones de logo</title>
    <style>
      body {
        margin: 0;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        background: #0c111b;
        color: #e8edf5;
        padding: 32px 20px 64px;
      }
      h1 { text-align: center; font-size: 1.5rem; margin: 0 0 8px; }
      p { text-align: center; color: #94a3b8; margin: 0 0 32px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
        max-width: 900px;
        margin: 0 auto;
      }
      a {
        display: block;
        text-decoration: none;
        color: inherit;
        background: #131924;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 16px;
        text-align: center;
        transition: border-color 0.15s, transform 0.15s;
      }
      a:hover {
        border-color: rgba(255, 255, 255, 0.28);
        transform: translateY(-2px);
      }
      img {
        width: 120px;
        height: 120px;
        border-radius: 28px;
        display: block;
        margin: 0 auto 12px;
      }
      strong { display: block; font-size: 0.95rem; }
      span { display: block; margin-top: 4px; font-size: 0.75rem; color: #94a3b8; }
    </style>
  </head>
  <body>
    <h1>Nutri11 — elegí un logo</h1>
    <p>Decime el número (01–08) y lo dejo como logo oficial</p>
    <div class="grid">
      <a href="01-apple.svg"><img src="01-apple.svg" alt="" /><strong>01 · Manzana</strong><span>fruta clásica</span></a>
      <a href="02-utensils.svg"><img src="02-utensils.svg" alt="" /><strong>02 · Cubiertos</strong><span>tenedor + cuchillo</span></a>
      <a href="03-leaf.svg"><img src="03-leaf.svg" alt="" /><strong>03 · Hoja</strong><span>fresco / natural</span></a>
      <a href="04-bowl.svg"><img src="04-bowl.svg" alt="" /><strong>04 · Bowl</strong><span>comida + vapor</span></a>
      <a href="05-carrot.svg"><img src="05-carrot.svg" alt="" /><strong>05 · Zanahoria</strong><span>comida sana</span></a>
      <a href="06-plate.svg"><img src="06-plate.svg" alt="" /><strong>06 · Plato</strong><span>plato + reloj</span></a>
      <a href="07-coffee.svg"><img src="07-coffee.svg" alt="" /><strong>07 · Taza</strong><span>desayuno / café</span></a>
      <a href="08-salad.svg"><img src="08-salad.svg" alt="" /><strong>08 · Ensalada</strong><span>bowl saludable</span></a>
    </div>
  </body>
</html>
